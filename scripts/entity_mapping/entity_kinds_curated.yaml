# Hand-curated kind per sheet entity, read by build_mapping.py.
#
# Keys are the sheet's entity names after whitespace normalisation (newlines and
# runs of spaces collapsed to one space). Values:
#   kind       one of the kinds in build_mapping.KINDS (required)
#   canonical  repaired / expanded name when the sheet's spelling is broken or
#              a Proper-Cased acronym (optional; default = entity)
#   prefer     per-entity override of the preferred ontology order (optional)
#   query      OLS search string when the name itself will not hit (optional;
#              a list tries each in turn)
#   generic    true = a schema-level class or slot ("Taxon", "Host", "Body Site");
#              keep Thomas's matches but do not fill from OLS
#   exact_only true = never accept a non-exact OLS hit for this entity
#   rationale  one line, only where the call is not obvious
#   wrong      {concept_id: reason} hand-flagged wrong matches in Thomas's output
#   assign     list of hand-assigned concepts for entities no matcher finds, each
#              {id, match, note, secondary}: `id` is a CURIE looked up on OLS (label
#              and definition come from there); `match` is exact / broader /
#              function-of-product / component / negation; `secondary` is a
#              non-ontology identifier worth keeping (KEGG KO, InterPro, VFDB).
#              Assigned rows come first (source = curated) and switch the OLS fill off.
#   no_class   reason string: checked by hand, no class exists in any OLS ontology;
#              the placeholder row proposes a local micokg class instead.
#
# Broken fragments that could be repaired carry the kind of the repaired entity
# and say so in the rationale; only the unrepairable ones are junk-fragment.

