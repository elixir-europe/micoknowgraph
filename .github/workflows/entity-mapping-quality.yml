name: Entity mapping quality

on:
  pull_request:
    paths:
      - '.github/workflows/entity-mapping-quality.yml'
      - 'scripts/entity_mapping/**'
      - 'data/entity_mapping/**'
      - 'tests/**'
      - 'requirements-test.txt'
  push:
    paths:
      - '.github/workflows/entity-mapping-quality.yml'
      - 'scripts/entity_mapping/**'
      - 'data/entity_mapping/**'
      - 'tests/**'
      - 'requirements-test.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality:
    # Для Python 3.9 в manifests setup-python доступна сборка Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Установить зависимости тестов
        run: python -m pip install -r requirements-test.txt
      - name: Проверить реальную offline-сборку и контракты таблиц
        run: python -I -m unittest discover -s tests -v
      - name: Сохранить диагностику текущего снимка
        if: ${{ always() }}
        run: >-
          python -I scripts/entity_mapping/validate_mapping.py
          --report '${{ runner.temp }}/entity-mapping-quality.json'
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Опубликовать отчет проверки
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: entity-mapping-quality-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/entity-mapping-quality.json
          if-no-files-found: error
          retention-days: 14
